<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Vanko on Google Play...</title>
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.suraj.eventpulse">
  <link rel="canonical" href="https://play.google.com/store/apps/details?id=com.suraj.eventpulse">
  <script>
    window.location.replace("https://play.google.com/store/apps/details?id=com.suraj.eventpulse" + window.location.search);
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #09090b;
      color: #fafafa;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #3b82f6;
      text-decoration: underline;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Redirecting to Google Play...</h2>
  <p>If you are not redirected automatically, <a href="https://play.google.com/store/apps/details?id=com.suraj.eventpulse">click here to download Vanko</a>.</p>
</body>
</html>
